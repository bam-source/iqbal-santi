<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan - Undangan Pernikahan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FAF8F3 0%, #DCEBF3 50%, #EDF5F8 100%);
      color: #617783;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 400px; }
    .code {
      font-family: 'Playfair Display', serif;
      font-size: 80px;
      font-weight: 700;
      color: #C9B890;
      line-height: 1;
      margin-bottom: 16px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: #344B57;
      margin-bottom: 12px;
    }
    .message {
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #344B57, #617783);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(52, 75, 87, 0.2);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(52, 75, 87, 0.3);
    }
    .divider {
      width: 80px;
      margin: 0 auto 24px;
      opacity: 0.5;
    }
    .divider svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="divider">
      <svg viewBox="0 0 200 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 15 Q50 0 100 15 Q150 30 200 15" stroke="#C9B890" stroke-width="1" fill="none"/>
        <circle cx="100" cy="15" r="4" fill="#C9B890" opacity="0.5"/>
      </svg>
    </div>
    <p class="code">404</p>
    <h1 class="title">Halaman Tidak Ditemukan</h1>
    <p class="message">Sepertinya halaman yang kamu cari sudah dipindahkan atau tidak tersedia.</p>
    <a class="btn" href="./">Kembali ke Undangan</a>
  </div>
</body>
</html>
